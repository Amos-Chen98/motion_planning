# Control loop
control_loop_rate: 40.0

# Trajectory tracking
trajectory_sample_interval: 0.05
trajectory_buffer_max_length: 10.0

# Snake motion
snake_mode_enabled: true
snake_ik_singularity_xz_norm_threshold: 0.10

# Output safety gates for full_state_target.
max_joint_step_before_publish: 0.50
max_baselink_tilt_before_publish: 1.20

# Publish gating for full_state_target.
# When enabled, the planner only publishes after the root pose has moved enough
# relative to the last published root pose.
publish_only_on_significant_root_motion: true
publish_root_translation_threshold: 0.05
publish_root_rotation_threshold: 0.0872664626

# Stability projection QP
stability_qp_max_iterations: 20
stability_qp_joint_step_limit: 0.1
stability_qp_regularization: 0.001
stability_qp_convergence_tol: 0.001
stability_qp_feasibility_tol: 0.0001

# Conservative stability thresholds.
# These are intentionally stricter than the raw robot-model thresholds.
stability_check_fc_t: false
stability_fc_rp_min_thre: 3.2
stability_fc_t_min_thre: 0.01
stability_static_thrust_min: 2.0
stability_static_thrust_max: 30.0
stability_overlap_min_clearance: 0.01

# Stable-candidate retrieval and repair.
stability_candidate_history_size: 32
stability_candidate_top_k: 6
stability_candidate_max_repairs: 2
