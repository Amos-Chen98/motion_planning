# Per-candidate joint-space planning.
JointReferenceDt: 0.10
JointPlanningTimeout: 0.05
JointValidityResolution: 0.025
JointPlannerSeed: 1
MaxJointVelocity: 4.0
MaxJointCommandStep: 0.10

# Joint-space stability projection.
StabilityQpMaxIterations: 20
StabilityQpJointStepLimit: 0.10
StabilityQpRegularization: 0.001
StabilityQpConvergenceTolerance: 0.001

# Whole-body swept-volume selection and direct execution.
# Each link capsule encloses the approximately 0.40 m-wide gimbal projection.
WholeBodyRadius: 0.20
PlanActivationLeadTime: 0.75
RootChildFrameId: root
