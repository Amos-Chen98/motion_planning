# GCOPTER map/path configuration.
TimeoutRRT: 0.1
MaxBdrMag: 2.1
MaxTiltAngle: 1.05
GravAcc: 9.8
WeightT: 20.0
ChiVec: [1.0e+4, 1.0e+4, 1.0e+4, 1.0e+4]
SmoothingEps: 1.0e-2
IntegralIntervs: 16
RelCostTol: 1.0e-5

# Online replanning, plan activation, and goal handling.
ReplanTriggerRatio: 0.3
PlanActivationLeadTime: 0.75
GoalTolerance: 0.2
PlanningHorizon: 3.0
ZeroLocalTargetVel: true

# Root motion primitive sampling.
CandidateCount: 9
MaxPrimitiveOffset: 0.8
MinimumPieceDuration: 0.20

# Command publication.
CommandHz: 40.0
PublishYawCommand: true
MaxAngularVel: 1.0

# Follow-the-leader prediction and kinematic validity.
TrajectorySampleInterval: 0.05
TrajectoryBufferMaxLength: 10.0
SnakeIkSingularityThreshold: 0.10

# Flight-feasibility constraints.
FeasibilityTolerance: 1.0e-4
StabilityCheckFcT: false
FcRpMinThreshold: 3.2
FcTMinThreshold: 0.01
StaticThrustMin: 2.0
StaticThrustMax: 30.0
OverlapMinClearance: 0.01
MaxBaselinkTilt: 1.20

# Per-candidate joint-space planning and command continuity.
JointReferenceDt: 0.10
JointPlanningTimeout: 0.15
JointValidityResolution: 0.025
JointPlannerSeed: 1
MaxJointCommandStep: 0.10

# Feasible whole-body candidate ranking.
# Equivalent seconds charged per radian when ranking feasible whole-body plans.
JointMotionCostWeight: 0.25
# Equivalent seconds charged per metre of downstream-link tracking RMS.
TrackingErrorCostWeight: 6.0

# Joint-space stability projection.
StabilityQpMaxIterations: 20
StabilityQpJointStepLimit: 0.10
StabilityQpRegularization: 0.001
StabilityQpConvergenceTolerance: 0.001

# Whole-body frame integration.
RootChildFrameId: root
